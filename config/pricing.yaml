# 모델 단가표. 단위: USD / 1M 토큰.
#
#   - 여기에 없는 모델은 비용 0 으로 계상하고 "가격 미상" 으로 경고합니다.
#     절대 죽지 않습니다.
#   - 0 을 적는 것과 생략하는 것은 다릅니다:
#       0 명시  = "공짜인 걸 안다"     → 경고 없음
#       생략    = "가격을 모른다"      → 경고. 유료 모델을 빠뜨렸을 때의 안전망
#     그래서 무료 모델도 습관적으로 비우지 말고 0 으로 적어 두세요.
#
#   - 키는 **프로바이더가 응답에 담아 돌려주는 모델 문자열** 과 정확히 같아야
#     합니다. 요청에 쓴 ID 와 다를 수 있습니다. 확실히 하려면 한 번 돌려보고
#     "가격 미상: ..." 경고가 출력하는 문자열을 그대로 복사하세요.

models:
  # ── Gemini 무료 티어 (2026-09 라이브 스모크에서 확인) ──────────────────
  # 무료 할당량 안에서는 과금이 0 입니다. 할당량을 넘기면 유료로 전환되므로,
  # 유료 사용이 시작되면 이 값을 실제 단가로 바꿔야 합니다.
  models/gemini-3.6-flash:
    input_per_1m: 0.0
    output_per_1m: 0.0
  models/gemini-3.5-flash-lite:
    input_per_1m: 0.0
    output_per_1m: 0.0

  # ── fake 모드 전용 ────────────────────────────────────────────────────
  fake-a:
    input_per_1m: 0.0
    output_per_1m: 0.0
  fake-b:
    input_per_1m: 0.0
    output_per_1m: 0.0
