[project]
name = "ai-debate-room"
version = "0.1.0"
description = "여러 AI가 다라운드 토론하고 별도 Judge AI가 평가하는 멀티 에이전트 시스템"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 슬라이스 4에서 추가로 설치합니다. 지금은 필요 없습니다.
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
debate = "debate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
