<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Debate Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%97%A3%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2a6df4; --ok:#127a4a; --warn:#a8620a; --bad:#b4232a; --idle:#9aa1ab;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --panel:#171a21; --ink:#e8eaee; --muted:#9aa1ab; --line:#252a33;
  --accent:#5b8dff; --ok:#3fbc82; --warn:#d99a3c; --bad:#e8636b; --idle:#5b626d;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
button{padding:8px 14px;border:0;border-radius:7px;background:var(--accent);
  color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 비용 바 — 항상 보입니다 */
.costbar{position:sticky;top:0;z-index:9;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;
  display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.metric{display:flex;flex-direction:column}
.metric .k{font-size:11px;color:var(--muted);letter-spacing:.02em}
.metric .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .v.small{font-size:14px;font-weight:600}
.metric.primary .v{color:var(--accent)}
.est{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}

/* 참가자 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--bg)}
.card .lab{font-weight:700}
.card .mdl{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:6px}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.s-idle .dot{background:var(--idle)}
.s-queued .dot{background:var(--warn)}
.s-run .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.s-done .dot{background:var(--ok)}
.s-drop .dot{background:var(--bad)}
.s-queued{color:var(--warn)} .s-run{color:var(--accent)}
.s-done{color:var(--ok)} .s-drop{color:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.timer{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-top:4px}

.round-h{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
.round-h .n{font-size:15px;font-weight:700}
.round-h .m{font-size:12px;color:var(--muted)}
.turn{border-left:3px solid var(--line);padding:6px 0 6px 12px;margin:10px 0}
.turn .h{font-size:12px;color:var(--muted);margin-bottom:3px}
.turn .b{white-space:pre-wrap}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;
  background:var(--line);color:var(--muted);margin-left:6px}
.badge.bad{background:var(--bad);color:#fff}
ol.issues{margin:6px 0 0;padding-left:20px} ol.issues li{margin:2px 0}

/* 개입 패널 */
#gate{display:none;border-color:var(--accent);border-width:2px}
#gate.on{display:block}
#gate h3{margin:0 0 2px;font-size:14px;color:var(--accent)}
#countdown{font-variant-numeric:tabular-nums;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.win{color:var(--ok);font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px}
#log{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  color:var(--muted);max-height:150px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Debate Room</h1>
  <div class="sub">여러 AI가 다라운드로 토론하고, 별도 Judge가 평가합니다.</div>

  <!-- 항상 보이는 비용/토큰/요청수 -->
  <div class="costbar">
    <div class="metric primary"><span class="k">요청 수</span><span class="v" id="m-calls">0</span></div>
    <div class="metric primary"><span class="k">총 토큰</span><span class="v" id="m-tok">0</span></div>
    <div class="metric"><span class="k">입력 / 출력</span><span class="v small" id="m-io">0 / 0</span></div>
    <div class="metric"><span class="k">비용</span><span class="v small" id="m-cost">$0</span></div>
    <div class="est" id="m-est">견적: 아직 없음</div>
  </div>

  <div class="panel" id="setup">
    <div class="row">
      <div style="flex:1;min-width:240px">
        <label>주제</label>
        <input id="topic" value="원격근무는 팀 생산성을 높이는가">
      </div>
      <div style="width:90px">
        <label>라운드</label><input id="rounds" type="number" value="3" min="1" max="10">
      </div>
      <div style="width:150px">
        <label>개입 대기(초)</label><input id="gatesec" type="number" value="120" min="0" max="1800">
      </div>
    </div>
    <label>참가자 — 한 줄에 <code>provider/model</code></label>
    <textarea id="agents">fake/fake-a
fake/fake-b
fake/fake-c</textarea>
    <div class="row" style="margin-top:8px">
      <div style="flex:1;min-width:200px">
        <label>Judge (provider/model, 비우면 판정 없음)</label>
        <input id="judge" value="fake/fake-judge">
      </div>
      <label style="width:auto;margin:0"><input type="checkbox" id="usefake" checked
        style="width:auto;margin-right:6px">fake 모드</label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btn-create">견적 내기</button>
      <button id="btn-start" class="ghost" disabled>토론 시작</button>
      <span id="setup-msg" class="hint"></span>
    </div>
  </div>

  <!-- 사람 개입 -->
  <div class="panel" id="gate">
    <h3>제<span id="gate-round">?</span>라운드 시작 전 — 지시를 넣으시겠습니까?</h3>
    <div class="hint">이번 라운드에만 적용됩니다(1회용). 모든 참가자가 같은 지시를 봅니다.
      남은 시간 <span id="countdown">--</span>초 후 지시 없이 자동 진행됩니다.</div>
    <textarea id="gate-text" placeholder="예: 참가자 B가 든 통계의 출처를 캐물어라"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btn-send">지시 보내고 진행</button>
      <button id="btn-skip" class="ghost">지시 없이 바로 진행</button>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <strong id="status-line">대기 중</strong>
      <span class="hint" id="conn">미접속</span>
    </div>
    <div class="grid" id="cards" style="margin-top:10px"></div>
  </div>

  <div class="panel" id="issues-panel" style="display:none">
    <strong>확정된 쟁점</strong><ol class="issues" id="issues"></ol>
  </div>

  <div id="transcript"></div>

  <div class="panel" id="verdict-panel" style="display:none">
    <strong>판정</strong><div id="verdict"></div>
  </div>

  <div class="panel"><strong style="font-size:12px;color:var(--muted)">이벤트 로그</strong>
    <div id="log"></div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const n = x => (x ?? 0).toLocaleString('ko-KR');
let debateId = null, es = null, cards = {}, timers = {}, gateDeadline = null, gateTick = null;

function log(msg){ const el=$('log'); el.textContent += msg+'\n'; el.scrollTop = el.scrollHeight; }

function setMetrics(r){
  if(!r) return;
  $('m-calls').textContent = n(r.calls);
  $('m-tok').textContent   = n(r.total_tok);
  $('m-io').textContent    = n(r.in_tok)+' / '+n(r.out_tok);
  const c = parseFloat(r.cost_usd||'0');
  // 무료 티어에서는 금액이 0이라 토큰·요청수가 주 지표입니다.
  $('m-cost').textContent = c === 0 ? '$0 (무료)' : '$'+c.toFixed(6);
}

function card(p){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="lab">${p.label}</div><div class="mdl">${p.model}</div>
    <div class="state s-idle"><span class="dot"></span><span class="txt">대기</span></div>
    <div class="timer"></div>`;
  $('cards').appendChild(el);
  return {el, state: el.querySelector('.state'), txt: el.querySelector('.txt'),
          timer: el.querySelector('.timer')};
}

function setState(id, cls, text){
  const c = cards[id]; if(!c) return;
  c.state.className = 'state '+cls;
  c.txt.textContent = text;
}

function startTimer(id){
  stopTimer(id);
  const t0 = Date.now(), c = cards[id];
  timers[id] = setInterval(() => {
    c.timer.textContent = ((Date.now()-t0)/1000).toFixed(1)+'초 경과';
  }, 100);
}
function stopTimer(id){ if(timers[id]){ clearInterval(timers[id]); delete timers[id]; } }

function roundHeader(no){
  let h = document.getElementById('rh'+no);
  if(!h){
    h = document.createElement('div'); h.className='panel'; h.id='rh'+no;
    h.innerHTML = `<div class="round-h"><span class="n">제${no}라운드</span>
      <span class="m" id="rm${no}">진행 중…</span></div><div id="rb${no}"></div>`;
    $('transcript').appendChild(h);
  }
  return h;
}

function handle(ev){
  setMetrics(ev.running);
  switch(ev.type){
    case 'debate_started':
      $('cards').innerHTML=''; cards={};
      ev.participants.forEach(p => cards[p.id] = card(p));
      $('status-line').textContent = `진행 중 — ${ev.rounds}라운드`;
      break;
    case 'round_started':
      roundHeader(ev.round_no);
      $('status-line').textContent = `제${ev.round_no}라운드 진행 중`;
      Object.keys(cards).forEach(id => {
        stopTimer(id);
        if(ev.active.includes(id)){ setState(id,'s-queued','차례 대기'); cards[id].timer.textContent=''; }
      });
      break;
    case 'utterance_started':
      setState(ev.agent_id,'s-run','말하는 중'); startTimer(ev.agent_id);
      break;
    case 'utterance': {
      stopTimer(ev.agent_id);
      setState(ev.agent_id,'s-done','완료');
      cards[ev.agent_id].timer.textContent =
        (ev.latency_ms/1000).toFixed(1)+'초 · '+n(ev.out_tok)+'tok';
      const b = document.getElementById('rb'+ev.round_no);
      const d = document.createElement('div'); d.className='turn';
      d.innerHTML = `<div class="h">${ev.label} · ${(ev.latency_ms/1000).toFixed(1)}초 ·
        ${n(ev.out_tok)}tok ${ev.truncated?'<span class="badge bad">잘림</span>':''}</div>
        <div class="b"></div>`;
      d.querySelector('.b').textContent = ev.content;
      b.appendChild(d);
      break;
    }
    case 'agent_dropped':
      stopTimer(ev.agent_id); setState(ev.agent_id,'s-drop','드롭');
      cards[ev.agent_id].timer.textContent = ev.reason.slice(0,60);
      break;
    case 'round_completed':
      document.getElementById('rm'+ev.round_no).textContent =
        `벽시계 ${(ev.wall_ms/1000).toFixed(1)}초 · 최장 ${(ev.max_latency_ms/1000).toFixed(1)}초 ·
         ${ev.waves}웨이브 · 성공 ${ev.ok} 실패 ${ev.failed}`;
      break;
    case 'issues':
      $('issues-panel').style.display='block';
      $('issues').innerHTML = ev.issues.map(i=>`<li>${i.title}</li>`).join('');
      break;
    case 'awaiting_directive':
      $('status-line').textContent = `제${ev.round_no}라운드 시작 전 — 지시 대기 중`;
      openGate(ev.round_no, ev.timeout_s); break;
    case 'verdict': showVerdict(ev); break;
    case 'finished':
      closeGate();
      $('status-line').textContent = `종료 — ${ev.status} (사람 대기 ${ev.waited_s}초)`;
      Object.keys(timers).forEach(stopTimer);
      break;
    case 'error': $('status-line').textContent = '오류: '+ev.message; break;
  }
  if(ev.type!=='utterance') log(`[${String(ev.seq).padStart(3,'0')}] ${ev.type}`+
    (ev.round_no?` R${ev.round_no}`:'')+(ev.label?` ${ev.label}`:''));
}

function openGate(round, timeout){
  $('gate').classList.add('on');
  $('gate-round').textContent = round;
  $('gate-text').value=''; $('gate-text').focus();
  gateDeadline = Date.now() + timeout*1000;
  clearInterval(gateTick);
  gateTick = setInterval(()=>{
    const left = Math.max(0,(gateDeadline-Date.now())/1000);
    $('countdown').textContent = left.toFixed(0);
    if(left<=0) closeGate();
  }, 200);
}
function closeGate(){ $('gate').classList.remove('on'); clearInterval(gateTick); }

function showVerdict(v){
  $('verdict-panel').style.display='block';
  if(v.status==='unparsed'){
    $('verdict').innerHTML = `<div class="note">판정을 파싱하지 못했습니다. 원문만 저장되었습니다.</div>`;
    return;
  }
  const labels = Object.keys(v.totals).sort();
  let h = `<table><tr><th>참가자</th>`+
    ['근거','논리','반박','명료성'].map(k=>`<th class="num">${k}</th>`).join('')+
    `<th class="num">합계</th></tr>`;
  labels.forEach(L=>{
    const r = v.rubric[L]||{};
    h += `<tr><td class="${L===v.winner?'win':''}">${L}</td>`+
      ['근거','논리','반박','명료성'].map(k=>`<td class="num">${r[k]??'-'}</td>`).join('')+
      `<td class="num"><strong>${v.totals[L]}</strong></td></tr>`;
  });
  h += `</table><p style="margin:10px 0 4px"><strong>승자:</strong>
    <span class="win">${v.winner||'무승부'}</span> <span class="badge">${v.margin}</span></p>`;
  if(v.conclusion) h += `<p style="margin:4px 0"><strong>결론:</strong> ${v.conclusion}</p>`;
  if(v.dissent) h += `<p style="margin:4px 0"><strong>미해결 반론:</strong> ${v.dissent}</p>`;
  h += `<div class="note">judge: ${v.judge_model} · 프롬프트 ${n(v.prompt_tokens)}tok`+
       (v.truncated?' · ⚠ 판정이 잘렸습니다':'')+`</div>`;
  $('verdict').innerHTML = h;
}

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'},
                             body: JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

$('btn-create').onclick = async () => {
  $('setup-msg').textContent = '견적 계산 중…';
  try{
    const agents = $('agents').value.split('\n').map(s=>s.trim()).filter(Boolean)
      .map(s=>{const i=s.indexOf('/'); return {provider:s.slice(0,i), model:s.slice(i+1)};});
    const j = await post('/debates', {
      topic:$('topic').value, participants:agents, rounds:+$('rounds').value,
      judge: $('judge').value.trim() || null, use_fake: $('usefake').checked,
      gate_timeout_s: +$('gatesec').value,
    });
    debateId = j.debate_id;
    const e = j.estimate;
    $('m-est').innerHTML = `견적: 호출 <strong>${n(e.calls)}</strong>회 ·
      토큰 <strong>${n(e.tokens_low)}~${n(e.tokens_high)}</strong>
      · $${(+e.low_usd).toFixed(4)}~${(+e.high_usd).toFixed(4)}
      ${e.unpriced.length?'<br>가격 미상: '+e.unpriced.join(', '):''}`;
    $('setup-msg').textContent = `${debateId} 생성됨 · LLM 호출 ${j.llm_calls_made}회`;
    if(j.judge) $('setup-msg').textContent += ` · ${j.judge.note}`;
    $('btn-start').disabled = false;
    $('cards').innerHTML=''; cards={};
    j.participants.forEach(p => cards[p.id] = card(p));
  }catch(err){ $('setup-msg').textContent = '오류: '+err.message; }
};

$('btn-start').onclick = async () => {
  $('btn-start').disabled = true; $('btn-create').disabled = true;
  es = new EventSource(`/debates/${debateId}/stream`);
  es.onopen = () => $('conn').textContent = '연결됨 (SSE)';
  es.onerror = () => $('conn').textContent = '연결 끊김 — 새로고침하면 이어서 봅니다';
  es.onmessage = m => handle(JSON.parse(m.data));
  await post(`/debates/${debateId}/start`);
};

$('btn-send').onclick = async () => {
  try{ await post(`/debates/${debateId}/directive`, {text:$('gate-text').value}); closeGate(); }
  catch(err){ log('지시 실패: '+err.message); }
};
$('btn-skip').onclick = async () => {
  try{ await post(`/debates/${debateId}/proceed`); closeGate(); }
  catch(err){ log('진행 실패: '+err.message); }
};

// 새로고침해도 이어서 보기: ?id=... 로 재접속하면 버퍼된 이벤트가 재생됩니다.
const qs = new URLSearchParams(location.search);
if(qs.get('id')){
  debateId = qs.get('id');
  $('setup-msg').textContent = `${debateId} 에 재접속합니다…`;
  es = new EventSource(`/debates/${debateId}/stream`);
  es.onopen = () => $('conn').textContent = '재접속됨 — 지난 이벤트 재생 중';
  es.onmessage = m => handle(JSON.parse(m.data));
}
</script>
</body>
</html>
